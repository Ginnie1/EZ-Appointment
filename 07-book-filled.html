<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ Appointment - Book Filled</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">

    <header class="top">
      <div class="top-row">
        <div>
          <p class="greeting">Hi Oluwadamilare</p>
          <p class="sub">Book your appointment in less than a minute</p></div>
         <div class="notification"><img src="img/notification bell.svg" alt="Notification bell"></div></div>
      </div>
      <input class="search" placeholder="🔍 Find doctor or hospital..."></header>


    <section class="content">

      <div class="form-card">
        <label class="label">Select Hospital</label>
        <div class="option active">Bethesda Hospital, Akure</div>
        <div class="option">St. Rapha Specialist, Alagbaka</div>
        <div class="option">Grace Morris Hospital</div></div>

      <div class="form-card">
        <label class="label">Select Department</label>
        <div class="option active">General Outpatient</div>

        <label class="label" style="margin-top:8px">Select Preferred Health Provider</label>
        <div class="choice-group">
          <div class="option active">◉ No Preference (any provider available)</div>
          <div class="option">○ Dr. Samuel (Pediatrician)</div>
          <div class="option">○ Dr. Nonso (Physiotherapist)</div></div></div>

      <div class="form-card">
        <label class="label">Appointment Slot</label>

        <label class="label">Select date</label>
        <div class="date-row choice-group">
          <button class="choice">26<br>Aug</button>
          <button class="choice active">27<br>Aug</button>
          <button class="choice">28<br>Aug</button>
          <button class="choice">29<br>Aug</button></div>

        <label class="label" style="margin-top:10px">Select time</label>
        <div class="time-row choice-group">
          <button class="choice">8:00am</button>
          <button class="choice">9:00am</button>
          <button class="choice active">10:00am</button>
          <button class="choice">11:00am</button>
          <button class="choice">12:00pm</button></div></div>

      <a class="btn secondary" href="08-review.html">Continue to review</a>

    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
