<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ Appointment - Confirmation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <section class="content">

      <div class="confirm-icon">✓</div>
      <h2 class="center-title">Appointment Confirmed</h2>

      <div class="big-stat-row">
        <div class="big-stat">
          <span>Queue number</span>
          <strong>No. 3</strong></div>
        <div class="big-stat">
          <span>Estimated arrival</span>
          <strong>09:50am</strong></div></div>

      <div class="details">
        <div class="detail-line"><span>Hospital:</span><span>Bethesda Hospital, Akure</span></div>
        <div class="detail-line"><span>Provider:</span><span>No preference (any available Provider)</span></div>
        <div class="detail-line"><span>Date:</span><span>Thu, Aug 27, 2026</span></div>
        <div class="detail-line"><span>Time:</span><span>10:00am</span></div>
        <div class="detail-line"><span>Unit:</span><span>General Outpatient</span></div></div>

      <a class="btn" href="10-queue.html">Check Queue Status</a>
      <br>
      <a class="btn secondary" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=EZ+Appointment&dates=20260827T100000Z/20260827T110000Z&location=Bethseda+Hospital,+Akure" target="_blank">Add to Calendar</a>

      <nav class="bottom-nav">
      <a class="nav-item active" href="11-appointments.html">
        <span class="nav-icon"><img src="img/appointment.svg" alt="Appointments"></span>Appointments</a>
      <a class="nav-item" href="04-upcoming.html">
        <span class="nav-icon"><img src="img/home.svg" alt="Home"></span>Home</a>
      <a class="nav-item">
        <span class="nav-icon"><img src="img/profile.svg" alt="Profile"></span>Profile</a></nav>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
