<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Appointment - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
    <main class="app">
        <section class="hero">
            <div class="hero-logo">
                🩺 <strong>EZ Appointment</strong>
            </div>
            <h2>Skip<br>long queues</h2>
            <p>Book online<br>Arrive on time</p>
            <img src="img/drsam.png" alt="Dr. Samuel"
                class="doctor-image">
            <div class="doctor-message"><strong>I'm Dr. Samuel 👋</strong>
                <span>Ready when you are</span></div>
        </section>
        <section class="form">
            <h1>Welcome back</h1>
            <p class="intro">Log in to manage your appointments</p>
            <div class="field">
                <label for="login-email">Email/Phone Number</label>
                <input id="login-email"type="text" placeholder="name@example.com"></div>
            <div class="field">
                <label for="login-password">Password</label>
                <input id="login-password" type="password" placeholder="Type Password here"></div>
            <div class="login-options"><label><input type="checkbox">Remember me</label>
                <a href="#"class="link">Forgot Password?</a></div>
                <a href="04-upcoming.html" class="primary">Login</a>
            <div class="divider">Or Login with</div>
            <button type="button"class="secondary">Continue with Google</button>
            <p class="account-switch">New to EZ Appointment?
                <a href="03-signup.html"class="link">Sign Up</a></p>
        </section><div class="toast"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
