<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ Appointment - Queue Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <section class="content">
      <br>
      <h2 class="queue-title">Bethesda Hospital, Akure, General OPD</h2>
      <div class="queue-number">
        <span>You're</span>
        <strong>#3 in line</strong></div>
      <h2 class="queue-message">2 patients ahead, Estimated wait time 10 min</h2>

      <div class="details">
        <div style="text-align:center; font-size:9px">
          Estimated arrival
          <strong style="display:block; font-size:13px; margin-top:4px">09:50am</strong></div></div>

      <div class="progress"><div></div></div>

      <div class="leave">
        Leave home by: <h3>09:30am</h3></div>

      <a class="btn secondary" href="https://www.google.com/maps/dir/?api=1&destination=Bethseda+Hospital,+Akure" target="_blank">Get Directions</a>
      
      <nav class="bottom-nav">
      <a class="nav-item active" href="11-appointments.html">
        <span class="nav-icon"><img src="img/appointment.svg" alt="Appointments"></span>Appointments</a>
      <a class="nav-item" href="04-upcoming.html">
        <span class="nav-icon"><img src="img/home.svg" alt="Home"></span>Home</a>
      <a class="nav-item">
        <span class="nav-icon"><img src="img/profile.svg" alt="Profile"></span>Profile</a></nav>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
