<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZ Appointment, Book Empty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <header class="top">
      <div class="top-row">
        <div><br>
          <p class="greeting">Hi Oluwadamilare</p>
          <br><p class="sub">In a hurry?<br>Get the earliest available appointment with any provider</p></div>
        <div class="notification">
          <img src="img/notification bell.svg" alt="notification bell"></div></div>
      </div>
      <input class="search" placeholder="🔍 Find doctor or hospital..."></header>

      <br>
    <div class="form-card accordion">
  <label class="label">Hospital</label>

  <button class="accordion-header" type="button">
    <span>Select hospital</span>
    <span class="accordion-chevron">⌄</span></button>

  <div class="accordion-options">
    <button type="button" class="accordion-option">
      Bethesda Hospital, Akure</button>
 
    <button type="button" class="accordion-option">
      St. Rapha Specialist, Alagbaka
    </button></button></div>
</div>

<div class="form-card accordion">
<label class="label">Department</label>

  <button class="accordion-header" type="button">
    <span>Select department</span>
    <span class="accordion-chevron">⌄</span></button>

    <div class="accordion-options">
    <button type="button" class="accordion-option">
      General Outpation (GOPD)</button>
  </div></div>
  
<div class="form-card accordion">
<label class="label">Health Provider</label>

  <button class="accordion-header" type="button">
    <span>Select provider</span>
    <span class="accordion-chevron">⌄</span></button>

    <div class="accordion-options">
      <button type="button" class="accordion-option">
    ◉ No Preference (any provider available)</button>
    <button type="button" class="accordion-option">
      ○ Dr. Samuel (Pediatrician)</button>
    <button type="button" class="accordion-option">
      ○ Dr. Nonso (Physiotherapist)</button>
  </div></div>

  <div class="form-card accordion">
<label class="label">Date & Time</label>

  <button class="accordion-header" type="button">
    <span>Select appointment slot</span>
    <span class="accordion-chevron">⌄</span></button>
    <br>
    <label class="label"><strong>Date</strong></label>
        <div class="date-row choice-group">
          <button class="choice">26<br>Aug</button>
          <button class="choice active">27<br>Aug</button>
          <button class="choice">28<br>Aug</button>
          <button class="choice">29<br>Aug</button></div>

        <label class="label" style="margin-top:10px">
          <strong>Time</strong></label>
        <div class="time-row choice-group">
          <button class="choice">8:00am</button>
          <button class="choice">9:00am</button>
          <button class="choice active">10:00am</button>
          <button class="choice">11:00am</button>
          <button class="choice">12:00pm</button></div></div>
          <br>
      <a class="btn secondary" href="08-review.html">Continue to review</a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
